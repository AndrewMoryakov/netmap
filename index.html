<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта сети</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #0f1218; --panel: #171c25; --panel2: #1d2330; --line: #2a3242; --text: #e6e9ef; --muted: #8b95a7;
  --ok: #4cd37b; --warn: #f5a623; --bad: #ff5d5d; --info: #5aa9ff;
  --physical: #4f9cff; --happ: #ff8f3a; --clash: #b57bff; --anyconnect: #ff5d7a; --tailscale: #3ec9c0; --netbird: #4cd37b; --proxy: #e8d44d; --other: #8b93a1;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
button, input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
button { cursor: pointer; } button:hover { border-color: #46526b; } button:disabled { opacity: .5; cursor: default; }
input[type=text] { width: 190px; }
label { color: var(--muted); user-select: none; }
#live { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
#live.ok { background: var(--ok); } #live.err { background: var(--bad); }
#problems { display: flex; flex-direction: column; gap: 4px; padding: 8px 16px 0; }
.prob { display: flex; gap: 8px; padding: 6px 10px; border-radius: 6px; background: var(--panel); border-left: 4px solid var(--info); cursor: default; }
.prob.warn { border-left-color: var(--warn); } .prob.bad { border-left-color: var(--bad); background: #231820; }
.prob b { font-weight: 600; } .prob .d { color: var(--muted); }
.prob.collapsed .d { display: none; }
#probToggle { margin: 6px 16px 0; font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: none; padding: 0; text-align: left; }
nav { display: flex; gap: 2px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); margin-top: 8px; }
nav button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 6px 14px; }
nav button.on { color: var(--text); border-bottom-color: var(--info); }
main { padding: 12px 16px 40px; }
.hidden { display: none !important; }
#tab-map { display: flex; gap: 14px; align-items: flex-start; }
#mapwrap { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; overflow: auto; }
#map { width: 100%; height: auto; display: block; }
#side { width: 380px; flex: none; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 150px); overflow: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; }
.kv div:nth-child(odd) { color: var(--muted); } .kv div { overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
h2 { font-size: 14px; margin: 18px 0 6px; } h2:first-child { margin-top: 0; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; margin: 1px 3px 1px 0; font-size: 12px; border: 1px solid; }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); }
code, .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
.node { cursor: pointer; } .node rect.bg { transition: opacity .12s; }
.dimmed { opacity: .18; }
.edge { fill: none; stroke-linecap: round; transition: opacity .12s; }
.edge.dash { stroke-dasharray: 6 5; }
/* живой трафик: бегущие штрихи поверх линии «интерфейс → назначение» */
.flow { fill: none; stroke: #fff; stroke-opacity: .65; stroke-width: 2; stroke-dasharray: 3 13; stroke-linecap: round; pointer-events: none; animation: nmflow 1.2s linear infinite; transition: opacity .12s; }
@keyframes nmflow { to { stroke-dashoffset: -16; } }
/* подсветка изменений: узел мигает свечением, линия - яркостью */
.node.flash { animation: nmglow 1.6s ease-in-out 5; }
@keyframes nmglow { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 7px #ffd23f) drop-shadow(0 0 2px #ffd23f); } }
.edge.flash { animation: nmedge 1.6s ease-in-out 5; }
@keyframes nmedge { 0%, 100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 4px #ffd23f); } }
.sdot.pulse { animation: nmpulse 1.2s ease-in-out infinite; }
@keyframes nmpulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .flow, .node.flash, .edge.flash, .sdot.pulse { animation: none; } }
text { fill: var(--text); } text.sub { fill: var(--muted); font-size: 11px; } text.t { font-size: 12.5px; font-weight: 600; }
text.col { fill: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.sel rect.bg { stroke-width: 2.5; }
#legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 8px 0; color: var(--muted); font-size: 12px; }
#legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.vd { display: flex; gap: 8px; padding: 8px 12px; border-radius: 6px; background: var(--panel); border-left: 4px solid var(--info); margin-bottom: 6px; }
.vd.bad { border-left-color: var(--bad); background: #231820; } .vd.warn { border-left-color: var(--warn); } .vd.ok { border-left-color: var(--ok); }
.mc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 4px; margin-bottom: 10px; }
.mc h3 { margin: 0 0 2px; font-size: 13px; } .mc .st { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.seg button { border-radius: 0; margin: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; } .seg button.on { background: #2b3a55; border-color: #46628f; }
.ev { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.ev .src { color: var(--muted); font-size: 11px; }
.ev.warn .m { color: var(--warn); } .ev.bad .m { color: var(--bad); } .ev.ok .m { color: var(--ok); }
#map { user-select: none; -webkit-user-select: none; }
.node.draggable { cursor: grab; touch-action: none; } .node.draggable:active { cursor: grabbing; }
.node.droptarget rect.bg { stroke-dasharray: 5 3; } .node.dropover rect.bg { stroke-width: 3.5; fill: #243149; } .node.dragsrc { opacity: .55; }
#dragghost { stroke: #f5a623; stroke-width: 3; stroke-dasharray: 7 5; pointer-events: none; }
#planOverlay { position: fixed; inset: 0; background: #000a; z-index: 50; display: flex; justify-content: flex-end; }
#planPane { width: min(680px, 100%); height: 100%; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px 18px 40px; box-sizing: border-box; }
#planPane h2 { margin-top: 16px; }
.banner-ro { background: #1b2a20; border: 1px solid #2f5a37; color: #9fe0ae; padding: 7px 10px; border-radius: 6px; margin: 8px 0 10px; }
#planForm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 8px; }
#planForm input[type=text] { flex: 1; min-width: 200px; } #planForm select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
pre.cmd { background: #0f141c; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 8px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
.pw { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; } .pw .dot { margin-top: 5px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b3a55; border: 1px solid #46628f; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Карта сети</h1>
  <span class="muted" id="host"></span>
  <span class="muted" id="stamp"></span><span id="live" title="связь с локальным сервером"></span>
  <div class="spacer"></div>
  <button id="btnRefresh">Обновить</button>
  <label><input type="checkbox" id="auto" checked> авто, 5 с</label>
  <label title="Показать на карте каждый процесс, а не только 14 самых активных"><input type="checkbox" id="allProcs"> все процессы</label>
  <button id="btnDns" title="Опросить каждый DNS-сервер из таблицы адаптеров">Проверить DNS</button>
  <button id="btnExit" title="Узнать внешний IP напрямую и через локальные прокси (запрос к cloudflare.com)">Внешний IP</button>
  <button id="btnPlan" title="Составить план: как направить адрес или программу через другой интерфейс. Ничего не применяется">План…</button>
  <form id="traceForm" class="row" style="margin:0"><input type="text" id="traceInput" placeholder="домен или IPv4" spellcheck="false"><button>Путь</button></form>
</header>
<div id="problems"></div>
<nav id="tabs">
  <button data-tab="map" class="on">Карта</button>
  <button data-tab="mon">Монитор</button>
  <button data-tab="procs">Процессы</button>
  <button data-tab="net">Маршруты и DNS</button>
  <button data-tab="checks">Проверки</button>
  <button data-tab="links">Связи</button>
  <button data-tab="log">Журнал</button>
</nav>
<main>
  <div id="tab-map" class="tab">
    <div id="mapwrap"><div id="legend"></div><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="side"></aside>
  </div>
  <div id="tab-mon" class="tab hidden"></div>
  <div id="tab-procs" class="tab hidden"></div>
  <div id="tab-net" class="tab hidden"></div>
  <div id="tab-checks" class="tab hidden"></div>
  <div id="tab-links" class="tab hidden"></div>
  <div id="tab-log" class="tab hidden"></div>
</main>

<div id="planOverlay" class="hidden"><div id="planPane" role="dialog" aria-label="План переопределения связи">
  <div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0" id="planTitle">План переопределения связи</h2><button id="planClose">Закрыть</button></div>
  <div class="banner-ro">Это только план. Карта ничего не меняет в системе: команды выполняете вы сами, сначала пробный вариант с откатом.</div>
  <form id="planForm"><input type="text" id="planTarget" placeholder="адрес, подсеть (203.0.113.0/24) или домен" spellcheck="false"><button type="button" id="planReset" class="hidden" title="Вместо процесса указать адрес вручную">сбросить</button><label for="planVia">через</label><select id="planVia"></select><button>Составить план</button></form>
  <div id="planOut"></div>
</div></div>
<script>
'use strict';
if (location.protocol === 'file:') {
  document.body.innerHTML = '<div style="max-width:720px;margin:12vh auto;padding:24px;background:#171c25;border:1px solid #2a3242;border-radius:10px;font-size:15px;line-height:1.6"><h2 style="margin-top:0">Эту страницу нельзя открывать как файл</h2><p>Данные ей отдаёт локальный сервер, поэтому сама по себе она пустая. Запустите <b>«Карта сети.cmd»</b> с рабочего стола: страница откроется сама по адресу <b>http://127.0.0.1:47900/</b>.</p></div>';
  throw new Error('opened from file://');
}
const $ = (q, r = document) => r.querySelector(q);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clip = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const api = async path => {
  const r = await fetch(path, { headers: { 'X-NetMap': '1' }, cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
};
// Виды адаптеров, цвета и подписи приходят от сервера (netmap.config.json); здесь только встроенные виды самой карты.
const BUILTIN_KIND = {
  physical: ['#4f9cff', 'физический'], mine: ['#ffd23f', 'моя связь'], proxy: ['#e8d44d', 'локальный прокси'], other: ['#8b93a1', 'прочее'], dst: ['#c7cfdd', 'назначение'], proc: ['#6b7790', 'процесс'],
};
let KIND = { ...BUILTIN_KIND }, KIND_ORDER = ['physical'], TUN_KINDS = new Set(), LOCAL_PROXY_PORTS = [];
const DEDICATED_DST = new Set(['physical', 'happ', 'clash', 'anyconnect', 'netbird', 'tailscale', 'hyperv', 'wsl', 'other']);   // у этих видов свой узел назначения, у остальных - универсальный
function applyConfig(s) {
  KIND = { ...BUILTIN_KIND }; KIND_ORDER = ['physical']; TUN_KINDS = new Set();
  (s.kinds || []).forEach(k => { KIND[k.kind] = [k.color || '#8b93a1', k.label || k.kind]; KIND_ORDER.push(k.kind); if (k.tun) TUN_KINDS.add(k.kind); });
  KIND_ORDER.push('other'); LOCAL_PROXY_PORTS = s.localProxyPorts || [];
}
const kc = k => (KIND[k] || KIND.other)[0];
const kl = k => (KIND[k] || KIND.other)[1];
const isTun = k => TUN_KINDS.has(k);

let state = null, prev = null, selected = null, events = [], checks = { dns: null, exit: null, trace: null }, busy = false, timer = null, tab = 'map';

/* ------------------------------------------------------------ скорость, изменения, режим «все процессы» */
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { } };
let expandProcs = lsGet('nm.allProcs') === '1';
const rates = new Map();   // имя адаптера -> { rx, tx (байт/с, null пока не измерено), hist: [сумма за интервал] }
const fmtRate = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' МБ/с' : b >= 1024 ? Math.round(b / 1024) + ' КБ/с' : Math.round(b) + ' Б/с';
function updateRates(a, b) {
  const dt = a ? (Date.parse(b.ts) - Date.parse(a.ts)) / 1000 : 0;
  const pa = a ? new Map(a.adapters.map(x => [x.name, x])) : new Map(), seen = new Set();
  for (const x of b.adapters) {
    seen.add(x.name);
    let r = rates.get(x.name); if (!r) { r = { rx: null, tx: null, hist: [] }; rates.set(x.name, r); }
    const o = pa.get(x.name);
    if (!o || x.rxBytes == null || o.rxBytes == null) continue;
    if (x.rxBytes < o.rxBytes || x.txBytes < o.txBytes) { r.rx = r.tx = null; continue; }   // счётчик сброшен (адаптер переподнялся)
    if (dt < 0.5) continue;
    r.rx = (x.rxBytes - o.rxBytes) / dt; r.tx = (x.txBytes - o.txBytes) / dt;
    r.hist.push(r.rx + r.tx); if (r.hist.length > 40) r.hist.shift();
  }
  for (const k of [...rates.keys()]) if (!seen.has(k)) rates.delete(k);
}
const FLASH_MS = 8000;
let lastSigs = null, lastProcs = null, lastEdges = null;
const flashAt = new Map(), flashWhy = new Map();   // id узла / ключ линии -> время изменения, что изменилось
const STATUS_COLOR = { ok: '#4cd37b', warn: '#f5a623', bad: '#ff5d5d', off: '#6b7790' };

/* ------------------------------------------------------------ журнал событий */
function logEv(level, text) { events.unshift({ t: new Date(), level, text }); if (events.length > 400) events.pop(); }
function diffEvents(a, b) {
  if (!a) { logEv('ok', 'Страница открыта, первый снимок получен'); return; }
  const ad = new Map(a.adapters.map(x => [x.name, x])), bd = new Map(b.adapters.map(x => [x.name, x]));
  for (const [n, x] of bd) { const o = ad.get(n); if (!o) logEv('info', `Адаптер «${n}» появился (${x.status})`); else if (o.status !== x.status) logEv(x.status === 'Up' ? 'ok' : 'warn', `Адаптер «${n}»: ${o.status} → ${x.status}`); }
  for (const n of ad.keys()) if (!bd.has(n)) logEv('warn', `Адаптер «${n}» исчез`);
  if (a.routes.internet.iface !== b.routes.internet.iface) logEv('warn', `Маршрут в интернет: «${a.routes.internet.iface}» → «${b.routes.internet.iface}»`);
  const sa = a.services, sb = b.services;
  if (sa.anyconnect.state !== sb.anyconnect.state) logEv(sb.anyconnect.state === 'Connected' ? 'ok' : 'warn', `AnyConnect: ${sa.anyconnect.state || '—'} → ${sb.anyconnect.state || '—'}`);
  if (sa.happ.tunUp !== sb.happ.tunUp) logEv('info', `Happ TUN: ${sb.happ.tunUp ? 'поднят' : 'снят'}`);
  if (sa.happ.running !== sb.happ.running) logEv('info', `Happ: ${sb.happ.running ? 'запущен' : 'остановлен'}`);
  if (sa.clash.running !== sb.clash.running) logEv('info', `Clash Verge: ${sb.clash.running ? 'запущен' : 'остановлен'}`);
  if (sa.tailscale.backend !== sb.tailscale.backend) logEv('info', `Tailscale: ${sa.tailscale.backend} → ${sb.tailscale.backend}`);
  const na = sa.netbird, nb = sb.netbird;
  if (na.installed && nb.installed) {
    if (na.daemonStatus !== nb.daemonStatus) logEv(nb.daemonStatus === 'Connected' ? 'ok' : 'bad', `NetBird: ${na.daemonStatus} → ${nb.daemonStatus}`);
    for (const k of ['management', 'signal']) if (na[k] && nb[k] && na[k].connected !== nb[k].connected) logEv(nb[k].connected ? 'ok' : 'bad', `NetBird ${k}: ${nb[k].connected ? 'подключён' : 'отключён'} ${nb[k].error || ''}`);
    const ra = na.relays.filter(r => r.available).length, rb = nb.relays.filter(r => r.available).length;
    if (ra !== rb) logEv('warn', `NetBird relay доступно: ${ra} → ${rb} из ${nb.relays.length}`);
    const pa = new Map(na.peers.map(p => [p.name, p]));
    for (const p of nb.peers) { const o = pa.get(p.name); if (o && (o.status !== p.status || o.type !== p.type)) logEv(p.status === 'Connected' ? 'ok' : 'info', `NetBird пир ${p.name}: ${o.status}/${o.type} → ${p.status}/${p.type}`); }
  }
  const pk = x => new Set(x.problems.filter(p => p.level !== 'info').map(p => p.title));
  const pa2 = pk(a), pb2 = pk(b);
  for (const p of b.problems) if (p.level !== 'info' && !pa2.has(p.title)) logEv(p.level, 'Замечание: ' + p.title);
  for (const t of pa2) if (!pb2.has(t)) logEv('ok', 'Замечание снято: ' + t);
}

/* ------------------------------------------------------------ граф */
function buildGraph(s) {
  const nodes = [], edges = [], byId = {};
  const add = n => { nodes.push(n); byId[n.id] = n; return n; };
  const edge = (from, to, o = {}) => { if (byId[from] && byId[to]) edges.push({ from, to, w: 1, ...o }); };
  const inetIf = s.routes.internet.iface;

  // порядок DNS: адаптеры по метрике
  const dnsRank = new Map(); s.dns.servers.forEach(d => { if (!dnsRank.has(d.adapter)) dnsRank.set(d.adapter, dnsRank.size + 1); });

  const order = KIND_ORDER;
  const ifs = [...s.adapters].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || a.metric - b.metric);
  const alertIf = new Set();
  const ac = s.services.anyconnect;
  s.adapters.filter(a => a.kind === 'anyconnect' && a.status === 'Up' && ac.state && ac.state !== 'Connected').forEach(a => alertIf.add(a.name));
  s.dns.check && s.dns.check.filter(r => !r.ok).forEach(r => alertIf.add(r.adapter));

  ifs.forEach(a => {
    const lines = [];
    if (a.status !== 'Up') lines.push({ t: 'отключён (' + a.status + ')', c: '#8b95a7' });
    if (a.ipv4.length) lines.push(a.ipv4[0] + '   метрика ' + a.metric);
    if (a.dns.length) lines.push({ t: 'DNS: ' + a.dns.join(', '), sub: true });
    if (a.gateway) lines.push({ t: 'шлюз ' + a.gateway, sub: true });
    if (a.name === inetIf) lines.push({ t: '★ сюда идёт интернет по умолчанию', c: '#f5a623' });
    if (dnsRank.has(a.name)) lines.push({ t: 'DNS опрашивается №' + dnsRank.get(a.name), sub: true });
    let rateLine = -1;
    if (a.status === 'Up' && a.rxBytes != null) {
      const rt = rates.get(a.name), has = rt && rt.rx != null, busyNow = has && rt.rx + rt.tx > 1024;
      rateLine = lines.length;
      lines.push({ t: has ? '↓ ' + fmtRate(rt.rx) + '   ↑ ' + fmtRate(rt.tx) : '↓ ↑ измеряю…', sub: !busyNow, c: busyNow ? '#9ad1ff' : undefined, vol: true });
    }
    const pi = links && links.perIface && links.perIface[a.name];
    if (pi && (pi.baseline + pi.later + pi.mine)) lines.push({ t: 'маршрутов: ' + pi.baseline + ' по умолч.' + (pi.later ? ' · +' + pi.later + ' после запуска' : '') + (pi.mine ? ' · ' + pi.mine + ' моих' : ''), sub: !pi.later, c: pi.later ? '#f5a623' : undefined });
    add({ id: 'if:' + a.name, col: 1, kind: a.kind, title: a.name, tag: kl(a.kind), lines, dim: a.status !== 'Up', alert: alertIf.has(a.name), type: 'iface', data: a, rateLine });
  });
  s.proxies.forEach(p => add({ id: 'proxy:' + p.port, col: 1, kind: 'proxy', title: 'Прокси 127.0.0.1:' + p.port, tag: p.process, lines: [{ t: 'приложения подключаются сюда напрямую', sub: true }], type: 'proxy', data: p }));

  // процессы
  const procs = s.connections.processes;
  const TOPN = 14, top = procs.slice(0, expandProcs ? procs.length : TOPN), rest = expandProcs ? [] : procs.slice(TOPN);
  const ifIndex = id => nodes.findIndex(n => n.id === id);
  top.forEach((p, i) => {
    const main = Object.entries(p.ifaces).sort((a, b) => b[1] - a[1])[0];
    const sortKey = main ? ifIndex((main[0].startsWith('proxy:') ? '' : 'if:') + main[0]) : 99;
    if (i >= TOPN) add({ id: 'pr:' + p.name, col: 0, kind: 'proc', compact: true, title: p.name, tag: p.total + ' соед.' + (main ? ' · ' + clip(main[0], 14) : ''), lines: [], type: 'proc', data: p, sortKey });   // компактный узел: в режиме «все процессы» их десятки
    else add({ id: 'pr:' + p.name, col: 0, kind: 'proc', title: p.name, tag: '', lines: [{ t: p.total + ' соед.' + (main ? ' · чаще через ' + clip(main[0], 22) : ''), sub: true, vol: true }], type: 'proc', data: p, sortKey });
  });
  if (rest.length) {
    const merged = {}; let tot = 0; rest.forEach(p => { tot += p.total; for (const [k, v] of Object.entries(p.ifaces)) merged[k] = (merged[k] || 0) + v; });
    add({ id: 'pr:*', col: 0, kind: 'proc', title: `ещё ${rest.length} процессов`, tag: '', lines: [{ t: tot + ' соед.', sub: true, vol: true }, { t: 'все — флажок «все процессы» вверху', sub: true }], type: 'proc', data: { name: 'прочие процессы', total: tot, ifaces: merged, remotes: [], list: rest.map(r => r.name), items: rest.map(r => ({ name: r.name, total: r.total, ifaces: r.ifaces })) }, sortKey: 98 });
  }
  const myLinks = (links && links.mine) || [];
  myLinks.forEach(L => {
    if (L.proc && byId['pr:' + L.proc]) return;   // источник - уже существующий узел процесса
    const st = linkSt(L);
    add({ id: 'my:' + L.id, col: 0, kind: 'mine', title: L.label, tag: 'моя связь', lines: [{ t: clip(L.prefixes.join(', '), 40), sub: true }, { t: st[0], c: st[1] }], type: 'mylink', data: { ...L, total: 0, ifaces: {} }, sortKey: -1 });
  });
  nodes.filter(n => n.col === 0).sort((a, b) => (a.sortKey - b.sortKey) || (b.data.total - a.data.total)).forEach((n, i) => { n.ord = i; });

  // назначения
  const physUp = s.adapters.find(a => a.kind === 'physical' && a.status === 'Up' && a.gateway);
  const exitDirect = checks.exit && checks.exit.find(x => x.label.startsWith('напрямую'));
  const inetLines = [];
  if (physUp) inetLines.push({ t: 'через шлюз ' + physUp.gateway + ' («' + clip(physUp.name, 18) + '»)', sub: true });
  if (exitDirect && exitDirect.ok) inetLines.push({ t: 'внешний IP ' + exitDirect.ip + ' · ' + exitDirect.country, c: '#4cd37b' });
  add({ id: 'dst:internet', col: 2, kind: 'dst', title: 'Интернет напрямую', tag: 'через оператора', lines: inetLines, type: 'dst', data: { what: 'internet' } });

  const happ = s.services.happ;
  const physNames = new Set(s.adapters.filter(a => a.kind === 'physical').map(a => a.name));
  const happProcs = s.connections.processes.filter(p => /^(xray|sing-box|happ|happd)$/i.test(p.name));
  const privRx = /^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/;
  // реальный выход Happ: соединение его процессов, которое ушло прямо через физический адаптер (мимо TUN)
  const upstream = happProcs.flatMap(p => p.remotes.filter(r => physNames.has(r.iface) && !privRx.test(r.ip)).map(r => ({ ...r, proc: p.name }))).sort((a, b) => b.count - a.count)[0];
  const happVia = a => happProcs.reduce((n, p) => n + (p.ifaces[a] || 0), 0);
  if (happ.running || s.adapters.some(a => a.kind === 'happ')) {
    const l = [];
    if (upstream) l.push({ t: upstream.proc + ' выходит наружу → ' + (upstream.host || upstream.ip) + ':' + upstream.port, sub: true });
    else l.push({ t: 'сервер цепочки по TCP-сокетам не виден (возможно UDP/QUIC)', sub: true });
    const he = checks.exit && checks.exit.find(x => LOCAL_PROXY_PORTS.some(p => x.label.includes(':' + p)) && x.ok);
    if (he) l.push({ t: 'внешний IP ' + he.ip + ' · ' + he.country, c: '#4cd37b' });
    if (happ.routing) l.push({ t: 'профиль «' + happ.routing.name + '», globalProxy ' + (happ.routing.globalProxy ? 'да' : 'нет'), sub: true });
    add({ id: 'dst:happ', col: 2, kind: 'happ', title: 'Прокси-сервер Happ', tag: 'зарубежный выход', lines: l, type: 'dst', data: { what: 'happ', upstream } });
  }
  const clashUp = s.adapters.some(a => a.kind === 'clash' && a.status === 'Up') || s.proxies.some(p => /mihomo|clash/i.test(p.process));
  if (clashUp) add({ id: 'dst:clash', col: 2, kind: 'clash', title: 'Прокси-сервер Clash', tag: 'Clash Verge', lines: [{ t: 'TUN ' + (s.services.clash.tunEnabled ? 'включён' : 'выключен') + ' в настройках', sub: true }], type: 'dst', data: { what: 'clash' } });
  const acIf = s.adapters.find(a => a.kind === 'anyconnect');
  if (acIf) add({ id: 'dst:corp', col: 2, kind: 'anyconnect', title: 'Корпоративная сеть', tag: 'AnyConnect', lines: [{ t: 'состояние: ' + (ac.state || '—'), c: ac.state === 'Connected' ? '#4cd37b' : '#f5a623' }, ac.server ? { t: 'шлюз ' + ac.server + (ac.tunnelMode ? ' · ' + ac.tunnelMode : ''), sub: true } : null].filter(Boolean), type: 'dst', data: { what: 'anyconnect' } });
  const nb = s.services.netbird;
  if (s.adapters.some(a => a.kind === 'netbird')) {
    const l = [];
    if (nb.installed) {
      l.push({ t: 'Management ' + (nb.management && nb.management.connected ? 'ок' : 'нет') + ' · Signal ' + (nb.signal && nb.signal.connected ? 'ок' : 'нет'), c: nb.management && nb.management.connected ? '#4cd37b' : '#ff5d5d' });
      l.push({ t: 'пиров ' + nb.peerConnected + '/' + nb.peerTotal + ' · relay ' + nb.relays.filter(r => r.available).length + '/' + nb.relays.length, sub: true });
    }
    add({ id: 'dst:netbird', col: 2, kind: 'netbird', title: 'NetBird-сеть', tag: nb.fqdn ? nb.fqdn.split('.').slice(1).join('.') : '', lines: l, type: 'dst', data: { what: 'netbird' } });
  }
  const ts = s.services.tailscale;
  if (s.adapters.some(a => a.kind === 'tailscale')) add({ id: 'dst:tailscale', col: 2, kind: 'tailscale', title: 'Tailscale-сеть', tag: ts.backend || '', lines: [{ t: 'пиров ' + (ts.peers || []).filter(p => p.name).length, sub: true }], type: 'dst', data: { what: 'tailscale' } });
  [...new Set(s.adapters.filter(a => !DEDICATED_DST.has(a.kind)).map(a => a.kind))].forEach(k => {
    const ads = s.adapters.filter(a => a.kind === k), upAds = ads.filter(a => a.status === 'Up');
    add({ id: 'dst:' + k, col: 2, kind: k, title: kl(k) + ' (сеть)', tag: upAds.length ? 'адаптер поднят' : 'адаптер отключён', lines: [{ t: ads.map(a => a.name + (a.ipv4[0] ? ' ' + a.ipv4[0] : '')).join(', '), sub: true }], type: 'dst', data: { what: k } });
  });
  if (s.adapters.some(a => a.kind === 'hyperv' || a.kind === 'wsl')) add({ id: 'dst:local', col: 2, kind: 'other', title: 'Локальные виртуальные сети', tag: 'Hyper-V / WSL', lines: [], type: 'dst', data: { what: 'local' } });

  // рёбра процесс → интерфейс
  nodes.filter(n => n.col === 0).forEach(pn => {
    for (const [ifn, cnt] of Object.entries(pn.data.ifaces)) {
      let tid = ifn.startsWith('proxy:') ? ifn : 'if:' + ifn;
      if (!byId[tid]) {
        if (!byId['if:?']) add({ id: 'if:?', col: 1, kind: 'other', title: 'не определён', tag: '', lines: [{ t: 'локальный адрес не найден среди адаптеров', sub: true }], type: 'iface', data: { name: 'не определён' }, dim: true });
        tid = 'if:?';
      }
      edge(pn.id, tid, { w: cnt, kind: byId[tid].kind, label: `${pn.data.name} → ${ifn}: ${cnt}` });
    }
  });
  // интерфейс → назначение
  const cnt = ifn => nodes.filter(n => n.col === 0).reduce((s2, n) => s2 + (n.data.ifaces[ifn] || 0), 0);
  ifs.forEach(a => {
    const id = 'if:' + a.name, c = Math.max(cnt(a.name), 1);
    if (a.kind === 'physical' && a.status === 'Up') {
      edge(id, 'dst:internet', { w: c, kind: 'physical', label: `${a.name} → интернет` });
      if (byId['dst:happ'] && happVia(a.name)) edge(id, 'dst:happ', { w: happVia(a.name), kind: 'physical', label: `процессы Happ выходят наружу через ${a.name}` });
      if (byId['dst:clash']) { const m = s.connections.processes.find(p => /mihomo/i.test(p.name)); if (m && m.ifaces[a.name]) edge(id, 'dst:clash', { w: m.ifaces[a.name], kind: 'physical', label: `mihomo выходит наружу через ${a.name}` }); }
    }
    if (a.kind === 'happ') edge(id, 'dst:happ', { w: c, kind: 'happ', label: 'TUN → sing-box → xray → прокси-сервер' });
    if (a.kind === 'clash') edge(id, 'dst:clash', { w: c, kind: 'clash', label: 'TUN → mihomo → прокси-сервер' });
    if (a.kind === 'anyconnect') edge(id, 'dst:corp', { w: c, kind: 'anyconnect', label: 'туннель корпоративного VPN' });
    if (a.kind === 'netbird') edge(id, 'dst:netbird', { w: c, kind: 'netbird', label: 'WireGuard-сеть NetBird' });
    if (a.kind === 'tailscale') edge(id, 'dst:tailscale', { w: c, kind: 'tailscale', label: 'сеть Tailscale' });
    if (!DEDICATED_DST.has(a.kind) && byId['dst:' + a.kind]) edge(id, 'dst:' + a.kind, { w: c, kind: a.kind, label: 'туннель: ' + kl(a.kind) });
    if (a.kind === 'hyperv' || a.kind === 'wsl') edge(id, 'dst:local', { w: c, kind: 'other', label: 'локальная виртуальная сеть' });
  });
  myLinks.forEach(L => {
    const from = (L.proc && byId['pr:' + L.proc]) ? 'pr:' + L.proc : 'my:' + L.id;
    edge(from, 'if:' + L.via, { w: 6, kind: 'mine', mine: L, label: 'моя связь: ' + L.label + ' → ' + L.via + ' (' + linkSt(L)[0] + ')' });
  });
  s.proxies.forEach(p => {
    const c = nodes.filter(n => n.col === 0).reduce((s2, n) => s2 + (n.data.ifaces['proxy:' + p.port] || 0), 0);
    if (/xray/i.test(p.process)) edge('proxy:' + p.port, 'dst:happ', { w: Math.max(c, 1), kind: 'proxy', label: `прокси :${p.port} → xray → сервер` });
    else edge('proxy:' + p.port, 'dst:clash', { w: Math.max(c, 1), kind: 'proxy', label: `прокси :${p.port} → mihomo → сервер` });
  });
  // зависимости управляющего канала (пунктир, идёт «назад»): через какой интерфейс достижим сервер
  s.endpoints.forEach(ep => {
    const to = 'if:' + ep.via, fromId = ep.id === 'netbird-control' ? 'dst:netbird' : 'dst:corp';
    const ifn = byId[to];
    edge(fromId, to, { dashed: true, w: 1, kind: ifn ? ifn.kind : 'other', warn: ifn && isTun(ifn.kind), label: `${ep.label}: достижим через «${ep.via}» (следующий узел ${ep.nextHop || 'on-link'})` });
  });
  // состояние каждого узла: цветная точка в заголовке (ok / warn / bad / off) и пояснение для подсказки
  nodes.forEach(n => {
    let r = ['ok', 'работает'];
    if (n.type === 'iface') r = n.alert ? ['bad', 'есть проблема (см. замечания вверху)'] : n.data.status !== 'Up' ? ['off', 'отключён'] : ['ok', 'поднят'];
    else if (n.type === 'proxy') r = ['ok', 'порт слушается'];
    else if (n.type === 'proc') r = Object.keys(n.data.ifaces).some(k => !byId[k.startsWith('proxy:') ? k : 'if:' + k]) ? ['warn', 'часть соединений идёт через неопределённый интерфейс'] : ['ok', 'есть соединения'];
    else if (n.type === 'mylink') { const L = n.data; r = (!L.viaUp && L.status !== 'planned') ? ['bad', 'интерфейс недоступен'] : { active: ['ok', 'действует'], claimed: ['warn', 'отмечена вручную'], drift: ['bad', 'расходится с записью'], planned: ['off', 'не применена'] }[L.status] || ['off', L.status]; }
    else if (n.id === 'dst:internet') r = !physUp ? ['bad', 'нет физического адаптера со шлюзом'] : exitDirect ? (exitDirect.ok ? ['ok', 'внешний адрес получен'] : ['bad', 'проверка выхода не прошла']) : ['ok', 'шлюз есть, выход не проверялся'];
    else if (n.id === 'dst:happ') r = happ.running ? ['ok', 'Happ запущен'] : ['warn', 'Happ не запущен'];
    else if (n.id === 'dst:corp') r = ac.state === 'Connected' ? ['ok', 'AnyConnect подключён'] : /reconnect/i.test(ac.state || '') ? ['bad', 'AnyConnect переподключается'] : ['warn', 'AnyConnect: ' + (ac.state || 'нет данных')];
    else if (n.id === 'dst:netbird') r = !nb.installed ? ['off', 'NetBird не установлен'] : (nb.management && nb.management.connected && nb.signal && nb.signal.connected) ? ['ok', 'Management и Signal подключены'] : (!(nb.management && nb.management.connected) && !(nb.signal && nb.signal.connected)) ? ['bad', 'Management и Signal не подключены'] : ['warn', 'подключено частично'];
    else if (n.id === 'dst:tailscale') r = ts.backend === 'Running' ? ['ok', 'Tailscale работает'] : ['warn', 'Tailscale: ' + (ts.backend || 'нет данных')];
    else if (n.id.startsWith('dst:') && n.data && s.adapters.some(a => a.kind === n.data.what)) r = s.adapters.some(a => a.kind === n.data.what && a.status === 'Up') ? ['ok', 'адаптер поднят'] : ['off', 'адаптер отключён'];
    n.st = r;
  });
  return { nodes, edges, byId };
}

const nodeH = n => n.compact ? 24 : 34 + n.lines.length * 14 + (n.tag ? 0 : -4);

function layout(g) {
  const X = [18, 392, 812], W = [262, 290, 300], GAP = 12, TOP = 30;
  const cols = [[], [], []]; g.nodes.forEach(n => cols[n.col].push(n));
  cols[0].sort((a, b) => a.ord - b.ord);
  let H = 0;
  cols.forEach((c, i) => { let y = TOP; c.forEach(n => { n.x = X[i]; n.w = W[i]; n.h = nodeH(n); n.y = y; y += n.h + GAP; }); H = Math.max(H, y); });
  // центрируем более короткие колонки относительно самой высокой
  cols.forEach(c => { if (!c.length) return; const used = c[c.length - 1].y + c[c.length - 1].h - TOP; const off = Math.max(0, (H - TOP - GAP - used) / 2); c.forEach(n => { n.y += off; }); });
  g.size = { w: X[2] + W[2] + 18, h: H + 10, X, W };
  // слоты рёбер на сторонах узлов
  g.nodes.forEach(n => { n.outs = []; n.ins = []; });
  g.edges.forEach(e => { if (e.dashed) return; g.byId[e.from].outs.push(e); g.byId[e.to].ins.push(e); });
  const spread = (list, n, key) => {
    list.sort((a, b) => g.byId[a[key]].y - g.byId[b[key]].y);
    list.forEach((e, i) => { const k = list.length; e['y_' + (key === 'to' ? 'from' : 'to')] = n.y + 16 + (n.h - 32) * (k === 1 ? .5 : i / (k - 1)); });
  };
  g.nodes.forEach(n => { spread(n.outs, n, 'to'); spread(n.ins, n, 'from'); });
}

function edgePath(e, g) {
  const a = g.byId[e.from], b = g.byId[e.to];
  if (e.dashed) {
    const x1 = a.x, y1 = a.y + a.h - 9, x2 = b.x + b.w, y2 = b.y + b.h - 9;
    return `M${x1},${y1} C${x1 - 70},${y1 + 26} ${x2 + 70},${y2 + 26} ${x2},${y2}`;
  }
  const x1 = a.x + a.w, y1 = e.y_from ?? a.y + a.h / 2, x2 = b.x, y2 = e.y_to ?? b.y + b.h / 2, dx = Math.max(40, (x2 - x1) * .5);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

function related(g, id) {
  const ids = new Set([id]), eds = new Set();
  const walk = (start, dir) => { const st = [start]; while (st.length) { const cur = st.pop(); for (const e of g.edges) { if (e.dashed) continue; const nxt = dir === 'down' ? (e.from === cur ? e.to : null) : (e.to === cur ? e.from : null); if (nxt) { eds.add(e); if (!ids.has(nxt)) { ids.add(nxt); st.push(nxt); } } } } };
  walk(id, 'down'); walk(id, 'up');
  for (const e of g.edges) if (e.dashed && (ids.has(e.from) || ids.has(e.to))) { eds.add(e); ids.add(e.from); ids.add(e.to); }
  return { ids, eds };
}

const edgeKey = e => e.from + '>' + e.to;
const flashLeft = k => { const t = flashAt.get(k); return t ? Math.max(0, FLASH_MS - (Date.now() - t)) : 0; };
// что изменилось с прошлой отрисовки: процессы сравниваем по набору интерфейсов (число соединений меняется всегда), остальные узлы - по тексту
function computeFlash(g) {
  const sigs = new Map(), procs = new Map(), edges = new Set(), now = Date.now();
  state.connections.processes.forEach(p => procs.set(p.name, Object.keys(p.ifaces).sort()));
  g.nodes.forEach(n => { if (n.type !== 'proc') sigs.set(n.id, [n.title, n.tag, 'состояние: ' + n.st[1], n.alert ? 'проблема' : '', n.dim ? 'отключён' : '',...n.lines.filter(l => !l.vol).map(l => typeof l === 'string' ? l : l.t)]); });
  g.edges.forEach(e => { if (!e.mine && !g.byId[e.from].type.startsWith('proc')) edges.add(edgeKey(e)); });
  if (lastSigs) {
    for (const [id, sg] of sigs) {
      const o = lastSigs.get(id);
      if (!o) { flashAt.set(id, now); flashWhy.set(id, 'появился'); continue; }
      const diff = []; for (let i = 0; i < Math.max(o.length, sg.length); i++) if (o[i] !== sg[i] && (o[i] || sg[i])) diff.push((o[i] || '—') + ' → ' + (sg[i] || '—'));
      if (diff.length) { flashAt.set(id, now); flashWhy.set(id, diff.slice(0, 3).join('; ')); }
    }
    g.nodes.forEach(n => {
      if (n.type !== 'proc' || n.id === 'pr:*') return;
      const o = lastProcs.get(n.data.name), cur = procs.get(n.data.name);
      if (!o) { if (!lastProcs.has(n.data.name)) { flashAt.set(n.id, now); flashWhy.set(n.id, 'новый процесс'); } }
      else if (o.join() !== cur.join()) { flashAt.set(n.id, now); flashWhy.set(n.id, 'интерфейсы: ' + o.join(', ') + ' → ' + cur.join(', ')); }
    });
    g.edges.forEach(e => {
      const k = edgeKey(e), src = g.byId[e.from];
      if (src.type === 'proc') {
        if (e.mine || src.id === 'pr:*') return;
        const o = lastProcs.get(src.data.name), ifn = e.to.replace(/^if:/, '');
        if (!o || !o.includes(ifn)) { flashAt.set(k, now); flashWhy.set(k, 'новое соединение процесса'); }
      } else if (!e.mine && !lastEdges.has(k)) { flashAt.set(k, now); flashWhy.set(k, 'новая связь'); }
    });
  }
  lastSigs = sigs; lastProcs = procs; lastEdges = edges;
}

function renderMap() {
  if (drag && drag.active) return;
  const g = buildGraph(state); layout(g); window.__g = g; computeFlash(g);

/* ------------------------------------------------------------ монитор */
const mon = { series: { dns: [], dnsnb: [], ping: [], wifi: [] }, events: [], gateway: '', zone: '', range: 5, ok: false };
const monLast = { dns: 0, dnsnb: 0, ping: 0, wifi: 0 };
let monNow = 0, monEvLast = 0;

async function pollMonitor() {
  try {
    const m = await api(`/api/monitor?since=${Math.max(0, monNow - 3000)}&ev=${monEvLast}`);
    monNow = m.now; mon.gateway = m.gateway; mon.zone = m.zone; mon.ok = true;
    for (const k of Object.keys(mon.series)) {
      const add = (m.series[k] || []).filter(x => x.t > monLast[k]);
      if (add.length) { monLast[k] = add[add.length - 1].t; mon.series[k] = mon.series[k].concat(add); }
      mon.series[k] = mon.series[k].filter(x => x.t > m.now - 21 * 60000);
    }
    for (const e of m.events) if (e.t > monEvLast) { mon.events.push(e); monEvLast = Math.max(monEvLast, e.t); }
    mon.events = mon.events.slice(-600);
  } catch (e) { mon.ok = false; }
}

function seriesStats(arr, fromT, field) {
  const a = arr.filter(x => x.t >= fromT), ok = a.filter(x => x.ok);
  const vals = ok.map(x => x[field]).sort((x, y) => x - y);
  const q = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : null;
  let jit = null;
  if (ok.length > 2) { let s = 0; for (let i = 1; i < ok.length; i++) s += Math.abs(ok[i][field] - ok[i - 1][field]); jit = s / (ok.length - 1); }
  const avg = vals.length ? vals.reduce((s, x) => s + x, 0) / vals.length : null;
  return { a, n: a.length, fail: a.length - ok.length, loss: a.length ? (a.length - ok.length) / a.length * 100 : 0, med: q(.5), p95: q(.95), max: vals.length ? vals[vals.length - 1] : null, min: vals.length ? vals[0] : null, avg, jit };
}

function chartSvg(arr, o) {
  const W = 960, H = 132, L = 50, R = 10, T = 10, B = 20, now = monNow || Date.now(), span = o.range * 60000, t0 = now - span;
  const a = arr.filter(x => x.t >= t0);
  const vals = a.filter(x => x.ok).map(x => x[o.field]);
  let ymax = o.ymax;
  if (!ymax) { const m = Math.max(50, ...vals); ymax = [50, 100, 200, 500, 1000, 2000, 3000].find(s => s >= m) || 3000; }
  const X = t => L + (t - t0) / span * (W - L - R), Y = v => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [0, .5, 1].forEach(f => { const y = T + (1 - f) * (H - T - B); s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2a3242"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10" style="fill:#8b95a7">${Math.round(ymax * f)}${o.unit}</text>`; });
  const step = o.range <= 5 ? 1 : o.range <= 10 ? 2 : 5;
  for (let m = 0; m <= o.range; m += step) { const t = now - m * 60000, x = X(t); s += `<line x1="${x}" x2="${x}" y1="${H - B}" y2="${H - B + 4}" stroke="#46526b"/><text x="${x}" y="${H - 5}" text-anchor="middle" font-size="10" style="fill:#8b95a7">${new Date(t).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</text>`; }
  // события (кроме справочных) вертикальными линиями
  mon.events.filter(e => e.t >= t0 && e.t <= now && e.level !== 'info').forEach(e => {
    const c = e.level === 'bad' ? '#ff5d5d' : e.level === 'ok' ? '#4cd37b' : '#f5a623';
    s += `<line x1="${X(e.t)}" x2="${X(e.t)}" y1="${T}" y2="${H - B}" stroke="${c}" stroke-dasharray="3 3" opacity=".8"><title>${esc(new Date(e.t).toLocaleTimeString('ru-RU') + ' ' + e.text)}</title></line>`;
  });
  // сбои: красные полосы
  a.filter(x => !x.ok).forEach(x => { s += `<rect x="${X(x.t) - 2.5}" y="${T}" width="5" height="${H - T - B}" fill="#ff5d5d" opacity=".35"><title>${esc(new Date(x.t).toLocaleTimeString('ru-RU') + ' сбой: ' + (x.why || 'нет ответа') + (x.ms ? ' (' + x.ms + ' мс)' : ''))}</title></rect>`; });
  // линия по успешным точкам; разрыв, если между точками больше 12 с (или был сбой)
  let d = '', prev = null;
  a.forEach(x => { if (!x.ok) { prev = null; return; } const p = `${X(x.t).toFixed(1)},${Y(x[o.field]).toFixed(1)}`; d += (prev && x.t - prev.t < 12000 ? 'L' : 'M') + p; prev = x; });
  if (d) s += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="1.6"/>`;
  a.filter(x => x.ok).forEach(x => { s += `<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x[o.field]).toFixed(1)}" r="1.7" fill="${o.color}"><title>${esc(new Date(x.t).toLocaleTimeString('ru-RU') + ': ' + x[o.field] + o.unit)}</title></circle>`; });
  if (!a.length) s += `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="12" style="fill:#8b95a7">данные собираются…</text>`;
  return s + '</svg>';
}

function verdictFor(range) {
  const f = (monNow || Date.now()) - range * 60000;
  const d = seriesStats(mon.series.dns, f, 'ms'), nb = seriesStats(mon.series.dnsnb, f, 'ms'), p = seriesStats(mon.series.ping, f, 'ms'), w = seriesStats(mon.series.wifi, f, 'v');
  if (d.n < 5 && p.n < 5) return [{ lvl: 'info', text: 'Данных пока мало — подождите около минуты.' }];
  const out = [];
  if (p.n >= 5 && (p.loss >= 5 || (p.med != null && p.med > 150))) out.push({ lvl: 'bad', text: `Канал до шлюза нестабилен: потери пинга ${p.loss.toFixed(0)}%, медиана ${p.med} мс. Сбои DNS и VPN вторичны — сначала проверьте сам канал (положение телефона, раздача, оператор).` });
  else if (w.n >= 3 && w.avg != null && w.avg < 40) out.push({ lvl: 'warn', text: `Слабый сигнал Wi-Fi (в среднем ${w.avg.toFixed(0)}%): возможны потери и задержки.` });
  if (d.n >= 5 && d.loss >= 10) out.push({ lvl: 'bad', text: `Системный резолвер не отвечает в ${d.loss.toFixed(0)}% попыток (${d.fail} из ${d.n}) при ${p.n >= 5 && p.loss < 5 ? 'исправном канале' : 'нестабильном канале'}. Смотрите порядок DNS и метрики адаптеров на вкладке «Маршруты и DNS»: мёртвый DNS-сервер у адаптера с низкой метрикой, перехват DNS со стороны VPN.` });
  if (mon.zone && nb.n >= 3 && nb.loss >= 50 && d.loss < 10) out.push({ lvl: 'bad', text: `Имена в зоне NetBird (${mon.zone}) не разрешаются (${nb.fail} из ${nb.n} попыток), а обычные имена разрешаются. Запросы в этой зоне уходят правилом NRPT на DNS самого NetBird, и он не отвечает. Клиент не сможет заново найти свой сервер. Решение: запись сервера в hosts либо отдельный DNS-домен для пиров на стороне сервера. (Проверка идёт случайными именами в этой зоне.)` });
  if (!out.length) out.push({ lvl: 'ok', text: 'За выбранный период сбоев не видно.' });
  return out;
}

const fmt = (v, u = '') => v == null ? '—' : (Math.round(v * 10) / 10) + u;
function renderMon() {

    { key: 'dnsnb', title: `Резолв имён в зоне NetBird (${mon.zone})`, sub: 'запрос в этой зоне идёт через правило NRPT на DNS самого NetBird', color: '#4cd37b', field: 'ms', unit: ' мс' },
    { key: 'ping', title: `Пинг шлюза ${mon.gateway || '—'}`, sub: 'качество канала до раздачи с телефона: потери и джиттер', color: '#e8d44d', field: 'ms', unit: ' мс' },

  h += verdictFor(R).map(v => `<div class="vd ${v.lvl}"><div>${v.lvl === 'bad' ? '⛔' : v.lvl === 'warn' ? '⚠' : v.lvl === 'ok' ? '✔' : 'ℹ'}</div><div>${esc(v.text)} <span class="muted">(эвристика, не доказательство)</span></div></div>`).join('');

const clientOnly = /^(Замечание|Happ|Clash|Tailscale|Страница|Проверка|План)/;

let drag = null, suppressClick = false, planTexts = [];
const planCtx = { proc: '', label: '' };

// что можно «взять и перетащить» на интерфейс: процесс или узел с известным адресом
function planSource(n, s) {
  s = s || state;
  if (!n || !s) return null;
  if (n.type === 'proc' && n.id !== 'pr:*' && n.data && n.data.name) return { proc: n.data.name, label: 'процесс ' + n.data.name };
  const ep = id => (s.endpoints || []).find(e => e.id === id);
  if (n.id === 'dst:netbird') { const e = ep('netbird-control'); if (e) return { target: e.ip, label: 'сервер NetBird ' + e.ip }; }
  if (n.id === 'dst:corp') { const e = ep('anyconnect-gateway'); if (e) return { target: e.ip, label: 'шлюз AnyConnect ' + e.ip }; }
  if (n.id === 'dst:happ' && n.data && n.data.upstream) return { target: n.data.upstream.ip, label: 'выход Happ ' + n.data.upstream.ip };
  return null;
}
const isDropTarget = n => n.type === 'iface' && n.data && n.data.kind && n.data.status === 'Up';

function toast(text) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}

function startDrag(ev, n, src) {
  if (ev.button !== 0 || drag) return;
  ev.preventDefault();
  const svg = $('#map');
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const d = drag = { n, src, x0: ev.clientX, y0: ev.clientY, active: false, over: null, ghost: null };
  const anchor = () => n.col === 0 ? { x: n.x + n.w, y: n.y + n.h / 2 } : { x: n.x, y: n.y + n.h / 2 };
  const setOver = grp => {
    if (d.over && d.over !== grp) d.over.classList.remove('dropover');
    d.over = grp || null; if (grp) grp.classList.add('dropover');
  };

    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onCancel); window.removeEventListener('keydown', onKey, true);
    const was = d.active, over = d.over;
    if (d.ghost) d.ghost.remove();
    document.querySelectorAll('g.node.droptarget, g.node.dropover, g.node.dragsrc').forEach(x => x.classList.remove('droptarget', 'dropover', 'dragsrc'));

    if (was) {
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
      if (drop && over) planOpen(src, over.dataset.iface, true);

    }
  };
  const onMove = e => {

      d.active = true;
      d.ghost = el('path', { id: 'dragghost', fill: 'none' }, svg);
      document.querySelectorAll('g.node').forEach(g => { if (g.dataset.iface) g.classList.add('droptarget'); if (g.dataset.id === n.id) g.classList.add('dragsrc'); });
    }
    const p = pt(e), a = anchor(), dx = Math.max(40, Math.abs(p.x - a.x) * .5) * (p.x >= a.x ? 1 : -1);
    d.ghost.setAttribute('d', `M${a.x},${a.y} C${a.x + dx},${a.y} ${p.x - dx},${p.y} ${p.x},${p.y}`);
    const t = document.elementFromPoint(e.clientX, e.clientY);

$('#side').addEventListener('click', e => { if (e.target.id === 'expandBtn') setExpand(true); });
$('#btnDns').onclick = () => runCheck($('#btnDns'), 'проверяю DNS', async () => { await api('/api/dnscheck'); await refresh(true); setTab('checks'); });
$('#btnExit').onclick = () => runCheck($('#btnExit'), 'проверяю IP', async () => { checks.exit = await api('/api/exit'); setTab('checks'); renderAll(); });
$('#traceForm').onsubmit = ev => { ev.preventDefault(); const v = $('#traceInput').value.trim(); if (!v) return; runCheck($('#traceForm button'), 'иду', async () => { checks.trace = await api('/api/trace?target=' + encodeURIComponent(v)); setTab('checks'); renderAll(); }); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#planOverlay').classList.contains('hidden')) { planClose(); return; } if (e.key === 'Escape' && selected) { selected = null; if (state && tab === 'map') { renderMap(); renderSide(); } } });
